<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello, World! 🚀</h1>
        <p>My static website is successfully deployed.</p>
        <p>This page is running without a backend.</p>
    </div>

</body>
</html>
