name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/imagnum-static:latest" .

      - name: Login to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login \
            -u "$USERNAME" --password-stdin

      - name: Push Image to Docker Hub
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/imagnum-static:latest"

      - name: Update Container
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker rm -f imagnum-container || true

          docker run -d \
            --name imagnum-container \
            --restart unless-stopped \
            -p 8080:80 \
            "$USERNAME/imagnum-static:latest"

      - name: Test Website
        run: |
          curl --fail http://localhost:8080
