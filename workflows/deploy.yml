name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t "$USERNAME/imagnum-static:latest" .

      - name: Login to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login \
            --username "$USERNAME" \
            --password-stdin

      - name: Push Image to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$USERNAME/imagnum-static:latest"

      - name: Update Local Container
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker rm -f imagnum-container || true

          docker run -d \
            --name imagnum-container \
            --restart unless-stopped \
            -p 8080:80 \
            "$USERNAME/imagnum-static:latest"

      - name: Verify Deployment
        run: |
          docker ps
          curl --fail http://localhost:8080
